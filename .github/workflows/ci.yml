name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      # dist/ is what GitHub actually executes, so it must match src/.
      - run: npm run build
      - name: Verify dist is current
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is out of date. Run npm run build and commit the result."
            git diff --stat dist
            exit 1
          fi
